# Fly.io config for the JobTrackr API.
# Neon is in us-east-1, so run in iad (Virginia) to keep DB round-trips short.
app = "jobtrackr-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Apply Prisma migrations before the new version starts taking traffic.
  release_command = "npx prisma migrate deploy"

[env]
  NODE_ENV = "production"
  PORT = "4000"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/v1/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

# Resumes are stored on local disk under RESUME_STORAGE_ROOT=/data/resumes.
# A volume pins the app to a single machine. Remove this if resumes move to R2.
[mounts]
  source = "resumes"
  destination = "/data"
